<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Group Qualification Dashboard</title>
<style>
  /* ─── RESET & BASE ─── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #f0f2f5; color: #1a1a2e;
    min-height: 100vh; padding: 1rem;
  }

  /* ─── LAYOUT ─── */
  .container { max-width: 720px; margin: 0 auto; }

  /* ─── HEADER ─── */
  .header {
    text-align: center; padding: 2rem 1rem 1.5rem;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    color: #fff; border-radius: 16px 16px 0 0;
  }
  .header h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: .25rem; }
  .header .subtitle { font-size: .85rem; opacity: .75; }
  .header .season { font-size: .8rem; opacity: .6; margin-top: .25rem; }
  .header .captain { font-size: .8rem; opacity: .8; margin-top: .35rem; }

  /* ─── STATUS SUMMARY ─── */
  .summary {
    background: #fff; padding: 1rem 1.25rem;
    border-bottom: 1px solid #e4e6ea;
    display: flex; flex-wrap: wrap; gap: .5rem; justify-content: center;
  }
  .chip {
    padding: .3rem .8rem; border-radius: 16px;
    font-size: .8rem; font-weight: 600;
  }
  .chip .n { font-size: 1rem; margin-right: .25rem; }
  .chip-Complete { background: #d7ecff; color: #0a58a6; }
  .chip-On-track { background: #e6f4ea; color: #137333; }
  .chip-Due-soon { background: #fff4e5; color: #b45309; }
  .chip-Behind   { background: #fce8e6; color: #b3261e; }
  .chip-No-data  { background: #f1f3f4; color: #5f6368; }

  /* ─── NEXT DEADLINE ─── */
  .deadline-bar {
    background: #16213e; color: #fff;
    padding: .85rem 1.25rem; text-align: center;
    font-size: .9rem; border-bottom: 1px solid #0f1a30;
  }
  .deadline-bar b { color: #ffd166; }

  /* ─── MEMBER CARD ─── */
  .member {
    background: #fff; border-bottom: 1px solid #e4e6ea;
    padding: 1rem 1.25rem;
  }
  .member:last-child { border-radius: 0 0 16px 16px; }
  .member-top {
    display: flex; align-items: center; justify-content: space-between;
    gap: .75rem; cursor: pointer;
  }
  .member-name { font-weight: 600; font-size: 1rem; }
  .member-sub {
    font-size: .75rem; color: #888; margin-top: 2px;
  }
  .badge {
    display: inline-block; padding: .25rem .7rem; border-radius: 16px;
    font-size: .78rem; font-weight: 600; white-space: nowrap;
  }
  .badge-Complete { background: #d7ecff; color: #0a58a6; }
  .badge-On-track { background: #e6f4ea; color: #137333; }
  .badge-Due-soon { background: #fff4e5; color: #b45309; }
  .badge-Behind   { background: #fce8e6; color: #b3261e; }
  .badge-No-data  { background: #f1f3f4; color: #5f6368; }

  .member-stats {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: .5rem; margin-top: .75rem;
  }
  .stat {
    background: #f8f9fb; border-radius: 10px; padding: .6rem .8rem;
    font-size: .8rem; color: #555;
  }
  .stat b { font-size: 1.05rem; color: #1a1a2e; margin-right: .2rem; }
  .stat .target { color: #999; }
  .stat .short { color: #b3261e; font-weight: 600; }
  .stat .short.ok { color: #137333; }

  .missed-list {
    margin-top: .6rem; font-size: .8rem; color: #b3261e;
  }
  .missed-list .lbl { font-weight: 600; margin-right: .3rem; }

  .milestones { margin-top: .6rem; display: none; }
  .member.open .milestones { display: block; }
  .milestone {
    display: flex; align-items: flex-start; gap: .6rem;
    padding: .5rem 0; border-top: 1px solid #f0f0f0;
  }
  .milestone .icon {
    width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: .7rem; margin-top: 1px;
  }
  .icon.met    { background: #e6f4ea; color: #137333; }
  .icon.missed { background: #fce8e6; color: #b3261e; }
  .icon.future { background: #f1f3f4; color: #999; }
  .milestone .info { flex: 1; }
  .milestone .deadline { font-weight: 600; font-size: .85rem; }
  .milestone .detail { font-size: .78rem; color: #888; margin-top: 1px; }
  .milestone .progress-nums { font-size: .78rem; color: #555; margin-top: 1px; }

  .toggle-hint { font-size: .72rem; color: #aaa; margin-top: .4rem; }

  /* ─── FOOTER ─── */
  .footer {
    text-align: center; padding: .9rem; font-size: .78rem; color: #999;
  }
  .footer a { color: #0a58a6; text-decoration: none; }
  .back-link {
    display: inline-block; margin-bottom: .75rem; font-size: .85rem;
    color: #0a58a6; text-decoration: none;
  }

  /* ─── LOADING / ERROR ─── */
  .loading, .error-msg {
    text-align: center; padding: 3rem 1rem;
    background: #fff; border-radius: 16px;
  }
  .loading { color: #666; }
  .spinner {
    width: 32px; height: 32px; border: 3px solid #e4e6ea;
    border-top-color: #1a1a2e; border-radius: 50%;
    animation: spin .8s linear infinite; margin: 0 auto 1rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-msg { color: #b3261e; }
  .error-msg h2 { margin-bottom: .5rem; }

  @media (max-width: 400px) {
    .header h1 { font-size: 1.3rem; }
  }
</style>
</head>
<body>
<div class="container" id="app">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>Loading your group dashboard…</p>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   CONFIGURATION — same web app deployment as the student progress page.
   The doGet router turns ?view=captain&token=xxx into a group dashboard.
   ═══════════════════════════════════════════════════════════════════════ */
var API_URL = 'https://script.google.com/macros/s/AKfycbx4SKpmVHMlCAE7vnuon95Pn_Dc5ED9xRM69UubolDIIB0xDHP_-F0-9ed9IaVI-YpT/exec';

(function () {
  var app = document.getElementById('app');

  // Read token from URL (the captain's own personal token)
  var params = new URLSearchParams(window.location.search);
  var token = (params.get('token') || '').trim();

  if (!token) {
    showError('No Token', 'This link is missing a token. ' +
      'Check the URL your coach gave you.');
    return;
  }

  // Fetch the captain view: same API, different query param
  var sep = API_URL.indexOf('?') >= 0 ? '&' : '?';
  var url = API_URL + sep + 'view=captain&token=' + encodeURIComponent(token);

  fetch(url)
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (data.error) { showError('Error', data.error); return; }
      render(data);
    })
    .catch(function (err) {
      showError('Connection Error',
        'Could not reach the server. Try refreshing in a moment.');
    });

  function showError(title, msg) {
    app.innerHTML = '<div class="error-msg"><h2>' + esc(title) + '</h2>' +
      '<p>' + esc(msg) + '</p></div>';
  }

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = (s === null || s === undefined) ? '' : String(s);
    return d.innerHTML;
  }

  function statusClass(s) { return 'status-' + s.replace(/\s+/g, '-'); }

  function render(d) {
    var html = '';

    html += '<a class="back-link" href="index.html?token=' + encodeURIComponent(token) +
      '">My personal progress ↗</a>';

    // Header
    html += '<div class="header">';
    html += '<h1>' + esc(d.group) + '</h1>';
    html += '<div class="subtitle">Qualification Dashboard</div>';
    if (d.seasonName) html += '<div class="season">' + esc(d.seasonName) + ' Season</div>';
    html += '<div class="captain">Captain: ' + esc(d.captain) + '</div>';
    html += '</div>';

    // Status summary chips
    html += '<div class="summary">';
    ['Behind', 'Due soon', 'On track', 'Complete', 'No data'].forEach(function (s) {
      var n = d.statusCounts[s] || 0;
      html += '<span class="chip chip-' + s.replace(/\s+/g, '-') + '">' +
        '<span class="n">' + n + '</span>' + esc(s) + '</span>';
    });
    html += '</div>';

    // Next deadline
    if (d.nextDeadline) {
      html += '<div class="deadline-bar">Next deadline <b>' +
        esc(d.nextDeadline.label) + '</b> — target ' +
        d.nextDeadline.practice + ' practice / ' + d.nextDeadline.service +
        ' service</div>';
    }

    // Members (server already sorts: Behind first, then name)
    if (!d.members || !d.members.length) {
      html += '<div class="member"><div class="member-sub">No active members ' +
        'found in this group. Check that the Roster tab Group column matches ' +
        'this group name.</div></div>';
    }

    d.members.forEach(function (m) {
      var badgeClass = 'badge-' + m.status.replace(/\s+/g, '-');
      html += '<div class="member" onclick="this.classList.toggle(\'open\')">';
      html += '<div class="member-top">';
      html += '<div><div class="member-name">' + esc(m.name) + '</div>' +
        '<div class="member-sub">' +
        (m.last ? 'last activity ' + esc(m.last) : 'no activity yet') +
        '</div></div>';
      html += '<span class="badge ' + badgeClass + '">' + esc(m.status) + '</span>';
      html += '</div>';

      // Core stats
      html += '<div class="member-stats">';
      html += '<div class="stat"><b>' + m.practice + '</b> practice' +
        (m.targetP ? ' <span class="target">/ ' + m.targetP + '</span>' : '') +
        '<br>needs <span class="' + (m.shortP === 0 ? 'short ok' : 'short') + '">' +
        (m.shortP === 0 ? '✓ met' : m.shortP + ' more') + '</span></div>';
      html += '<div class="stat"><b>' + m.service + '</b> service' +
        (m.targetS ? ' <span class="target">/ ' + m.targetS + '</span>' : '') +
        '<br>needs <span class="' + (m.shortS === 0 ? 'short ok' : 'short') + '">' +
        (m.shortS === 0 ? '✓ met' : m.shortS + ' more') + '</span></div>';
      html += '</div>';

      // Missed deadlines
      if (m.missed && m.missed.length) {
        html += '<div class="missed-list">⚠ <span class="lbl">Missed:</span>' +
          m.missed.map(esc).join(' · ') + '</div>';
      }

      // Milestones (collapsible)
      html += '<div class="milestones">';
      (m.milestones || []).forEach(function (ms) {
        var iconClass = ms.passed ? (ms.met ? 'met' : 'missed') : 'future';
        var iconChar = ms.passed ? (ms.met ? '✓' : '✗') : '○';
        html += '<div class="milestone">' +
          '<div class="icon ' + iconClass + '">' + iconChar + '</div>' +
          '<div class="info"><div class="deadline">' + esc(ms.deadline) + '</div>' +
          '<div class="progress-nums">' + ms.practiceEarned + '/' +
          ms.practiceTarget + ' practice · ' + ms.serviceEarned + '/' +
          ms.serviceTarget + ' service</div>';
        if (ms.notes) html += '<div class="detail">' + esc(ms.notes) + '</div>';
        html += '</div></div>';
      });
      html += '</div>';
      html += '<div class="toggle-hint">tap to expand milestones</div>';
      html += '</div>';
    });

    html += '<div class="footer">Dashboard as of ' + esc(d.asOf) + ' · ' +
      'updates live from ballots</div>';

    app.innerHTML = html;
  }
})();
</script>
</body>
</html>
