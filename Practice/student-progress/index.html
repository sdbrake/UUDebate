<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Qualification Progress</title>
<style>
  /* ─── RESET & BASE ─── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #f0f2f5; color: #1a1a2e;
    min-height: 100vh; padding: 1rem;
  }

  /* ─── LAYOUT ─── */
  .container { max-width: 600px; margin: 0 auto; }

  /* ─── HEADER ─── */
  .header {
    text-align: center; padding: 2rem 1rem 1.5rem;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    color: #fff; border-radius: 16px 16px 0 0;
  }
  .header h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: .25rem; }
  .header .subtitle { font-size: .85rem; opacity: .75; }
  .header .season { font-size: .8rem; opacity: .6; margin-top: .25rem; }

  /* ─── STATUS BADGE ─── */
  .status-card {
    background: #fff; padding: 1.25rem; text-align: center;
    border-bottom: 1px solid #e4e6ea;
  }
  .status-badge {
    display: inline-block; padding: .35rem 1rem; border-radius: 20px;
    font-weight: 600; font-size: .95rem; letter-spacing: .02em;
  }
  .status-Complete  { background: #d7ecff; color: #0a58a6; }
  .status-On-track  { background: #e6f4ea; color: #137333; }
  .status-Due-soon  { background: #fff4e5; color: #b45309; }
  .status-Behind    { background: #fce8e6; color: #b3261e; }
  .status-No-data   { background: #f1f3f4; color: #5f6368; }

  .as-of { font-size: .75rem; color: #888; margin-top: .5rem; }

  /* ─── CREDIT COUNTERS ─── */
  .credits {
    display: grid; grid-template-columns: 1fr 1fr;
    background: #fff; border-bottom: 1px solid #e4e6ea;
  }
  .credit-box {
    padding: 1.25rem; text-align: center;
    border-right: 1px solid #e4e6ea;
  }
  .credit-box:last-child { border-right: none; }
  .credit-box .label { font-size: .75rem; text-transform: uppercase;
    letter-spacing: .06em; color: #666; margin-bottom: .25rem; }
  .credit-box .count { font-size: 2rem; font-weight: 700; }
  .credit-box .target { font-size: .8rem; color: #999; }

  /* ─── NEEDS SECTION ─── */
  .needs {
    background: #fff; padding: 1rem 1.25rem;
    border-bottom: 1px solid #e4e6ea;
  }
  .needs h3 { font-size: .85rem; color: #666; margin-bottom: .5rem; }
  .needs .need-item {
    display: flex; justify-content: space-between;
    padding: .3rem 0; font-size: .9rem;
  }
  .needs .need-item .amount {
    font-weight: 600;
    color: #b3261e;
  }
  .needs .need-item .amount.done { color: #137333; }

  /* ─── MILESTONES ─── */
  .milestones {
    background: #fff; padding: 1rem 1.25rem;
    border-radius: 0 0 16px 16px;
  }
  .milestones h3 {
    font-size: .85rem; color: #666; margin-bottom: .75rem;
    text-transform: uppercase; letter-spacing: .04em;
  }
  .milestone {
    display: flex; align-items: flex-start; gap: .75rem;
    padding: .6rem 0; border-bottom: 1px solid #f0f0f0;
  }
  .milestone:last-child { border-bottom: none; }
  .milestone .icon {
    width: 24px; height: 24px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: .75rem; flex-shrink: 0; margin-top: 2px;
  }
  .icon.met    { background: #e6f4ea; color: #137333; }
  .icon.missed { background: #fce8e6; color: #b3261e; }
  .icon.future { background: #f1f3f4; color: #999; }
  .milestone .info { flex: 1; }
  .milestone .deadline { font-weight: 600; font-size: .9rem; }
  .milestone .detail { font-size: .8rem; color: #888; margin-top: 2px; }
  .milestone .progress-nums { font-size: .8rem; color: #555; margin-top: 2px; }

  /* ─── LAST ACTIVITY ─── */
  .last-activity {
    text-align: center; padding: .75rem;
    font-size: .8rem; color: #999;
    background: #fff; border-top: 1px solid #e4e6ea;
  }

  /* ─── MISSED DEADLINES ─── */
  .missed {
    background: #fff; padding: 1rem 1.25rem;
    border-bottom: 1px solid #e4e6ea;
  }
  .missed h3 { font-size: .85rem; color: #b3261e; margin-bottom: .5rem; }
  .missed ul { list-style: none; padding: 0; }
  .missed li {
    font-size: .85rem; color: #b3261e; padding: .2rem 0;
  }
  .missed li::before { content: '⚠ '; }

  /* ─── LOADING / ERROR ─── */
  .loading, .error-msg {
    text-align: center; padding: 3rem 1rem;
    background: #fff; border-radius: 16px;
  }
  .loading { color: #666; }
  .spinner {
    width: 32px; height: 32px; border: 3px solid #e4e6ea;
    border-top-color: #1a1a2e; border-radius: 50%;
    animation: spin .8s linear infinite; margin: 0 auto 1rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-msg { color: #b3261e; }
  .error-msg h2 { margin-bottom: .5rem; }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 400px) {
    .credit-box .count { font-size: 1.6rem; }
    .header h1 { font-size: 1.3rem; }
  }
</style>
<!-- Pilot styles are scoped: the original stylesheet and OFF layout are unchanged. -->
<style>
.student-view{max-width:1120px;color:#202c40;line-height:1.55;margin:12px auto}
.student-view [hidden]{display:none!important}
.student-view button,.student-view input,.student-view select{font:inherit;outline-offset:4px;max-width:100%;min-width:0}
.student-view button{min-height:44px;border:1px solid #cdd4df;border-radius:8px;background:#fff;color:#243750;padding:9px 14px;cursor:pointer}
.student-view button:hover{background:#edf1f8}
.student-view nav{display:flex;gap:8px;flex-wrap:wrap;background:#1e2e47;padding:20px 24px;border-radius:16px;margin-bottom:20px}
.student-view nav button{background:transparent;color:#fff;border-color:#69778a}
.student-view nav button[aria-pressed=true]{background:#fff;color:#1e2e47}
.student-view nav .refresh{margin-left:auto}
.student-view #progressPanel{max-width:760px;margin:0 auto}
.student-view .header{background:#1e2e47}
.student-view #ballotsPanel>h2{font-size:24px}
.student-view #ballotStatus{color:#5f6b7b;margin:4px 0 18px}
.student-view .filters{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}
.student-view .filters label{display:flex;flex-direction:column;gap:4px;color:#4a586c;font-size:13px;min-width:0;flex:1}
.student-view .filters .search-label{flex:2}
.student-view input,.student-view select{border:1px solid #cdd4df;border-radius:8px;background:#fff;padding:10px;min-height:44px;width:100%}
.student-view .ballot-workspace{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;align-items:start}
.student-view #ballotList{display:grid;gap:10px;min-width:0}
.student-view .ballot-card{text-align:left;width:100%;display:flex;flex-direction:column;gap:7px;overflow-wrap:anywhere;padding:16px;color:#243750}
.student-view .ballot-card[aria-pressed=true]{border-color:#597394;background:#e9eff7;color:#202c40;box-shadow:inset 3px 0 #597394}
.student-view .ballot-card strong{font-size:17px}
.student-view .ballot-card span{font-size:13px}
.student-view .chip{background:#e8edf3;border-radius:5px;padding:3px 7px;align-self:flex-start}
.student-view #reader{min-width:0;background:white;border:1px solid #dce1e8;border-radius:12px;padding:24px;overflow-wrap:anywhere}
.student-view #reader h2{font-size:23px;margin:5px 0 8px}
.student-view #reader h3{font-size:15px;margin:22px 0 6px}
.student-view #reader p{margin:5px 0}
.student-view .feedback{white-space:pre-wrap;overflow-wrap:anywhere}
.student-view .eyebrow{text-transform:uppercase;letter-spacing:1.8px;font-size:11px;font-weight:700}
.student-view .own-result{display:flex;flex-wrap:wrap;gap:12px 28px;border-block:1px solid #dce1e8;padding:12px 0;margin:20px 0;font-weight:600}
.student-view .win{color:#137333}.student-view .loss{color:#a52923}
.student-view small{display:block;color:#5f6b7b;margin-top:22px}
@media(max-width:760px){.student-view .ballot-workspace{grid-template-columns:minmax(0,1fr)}.student-view .filters label{flex-basis:40%}.student-view .filters .search-label{flex-basis:100%}.student-view #reader{padding:18px}.student-view nav{padding:14px}.student-view nav .refresh{margin-left:0}}
</style>
</head>
<body>
<div class="container" id="app">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>Loading your progress…</p>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   CONFIGURATION — change this after deploying your Apps Script web app.
   ═══════════════════════════════════════════════════════════════════════ */
var API_URL = 'https://script.google.com/macros/s/AKfycbx4SKpmVHMlCAE7vnuon95Pn_Dc5ED9xRM69UubolDIIB0xDHP_-F0-9ed9IaVI-YpT/exec';
// Example: 'https://script.google.com/macros/s/AKfyc.../exec'
// If using the combined doGet approach, append ?mode=student
// If using a separate deployment, just the /exec URL works.
/* ═══════════════════════════════════════════════════════════════════════ */

(function () {
  var app = document.getElementById('app');

  // Read token from URL
  var params = new URLSearchParams(window.location.search);
  var token = (params.get('token') || '').trim();

  if (!token) {
    showError('No Token', 'This link is missing a student token. ' +
      'Check the URL your coach gave you.');
    return;
  }

  // Fetch from Apps Script
  var url = API_URL + (API_URL.indexOf('?') >= 0 ? '&' : '?') + 'token=' +
    encodeURIComponent(token);

  var controller = new AbortController();
  var timedOut = false;
  var requestTimer = setTimeout(function () { timedOut = true; controller.abort(); }, 20000);
  fetch(url, { signal: controller.signal, cache: 'no-store', referrerPolicy: 'no-referrer' })
    .then(function (r) {
      if (!r.ok) {
        var error = new Error('HTTP failure');
        error.name = 'Server Error';
        throw error;
      }
      return r.json().catch(function () {
        var error = new Error('Invalid JSON');
        error.name = 'Data Error';
        throw error;
      });
    })
    .then(function (data) {
      if (timedOut) { var timeoutError = new Error('Request timed out'); timeoutError.name = 'AbortError'; throw timeoutError; }
      try {
        dataCheck(isObject(data));
        if (Object.prototype.hasOwnProperty.call(data, 'error')) {
          dataCheck(typeof data.error === 'string');
          showError('Error', data.error);
          return;
        }
        render(data);
        if (isObject(data.features) && data.features.newStudentView === true) enableStudentView(data);
      } catch (err) {
        showError('Data Error', 'The server returned invalid progress data. Contact your coach.');
      }
    })
    .catch(function (err) {
      if (timedOut || err.name === 'AbortError') {
        showError('Timeout Error', 'The request took too long. Try refreshing in a moment.');
      } else if (err.name === 'Data Error') {
        showError('Data Error', 'The server returned invalid progress data. Contact your coach.');
      } else if (err.name === 'Server Error') {
        showError('Server Error', 'The server could not complete the request. Try again later.');
      } else {
        showError('Connection Error', 'Could not reach the server. Try refreshing in a moment.');
      }
    }).finally(function () { clearTimeout(requestTimer); });

  function enableStudentView(data) {
    var legacy = app.innerHTML;
    app.classList.add('student-view');
    app.innerHTML = '<nav aria-label="Student page"><button id="progressTab" aria-pressed="true">My Progress</button><button id="ballotsTab" aria-pressed="false">My Ballots</button></nav><section id="progressPanel"></section><section id="ballotsPanel" hidden><h2>My Ballots</h2><p id="ballotStatus" role="status"></p></section>';
    document.getElementById('progressPanel').innerHTML = legacy;
    var loaded = false;
    document.getElementById('progressTab').onclick = function () { tab(false); };
    document.getElementById('ballotsTab').onclick = function () { tab(true); if (!loaded) { loaded = true; loadBallots(); } };
    function tab(ballots) {
      document.getElementById('progressPanel').hidden = ballots;
      document.getElementById('ballotsPanel').hidden = !ballots;
      document.getElementById('progressTab').setAttribute('aria-pressed', !ballots);
      document.getElementById('ballotsTab').setAttribute('aria-pressed', ballots);
    }
    var ballots = [], selected = '';
    var panel = document.getElementById('ballotsPanel');
    panel.insertAdjacentHTML('beforeend', '<div class="filters"><label>Source<select id="eventFilter"><option value="">All sources</option></select></label><label class="search-label">Search ballots<input id="searchBallots" type="search" placeholder="Event, names, judge, or resolution"></label></div><div class="ballot-workspace"><div id="ballotList" aria-label="Judge ballots"></div><article id="reader" tabindex="-1" aria-label="Selected ballot"></article></div>');
    document.getElementById('eventFilter').onchange = draw;
    document.getElementById('searchBallots').oninput = draw;
    var mobileBallots = window.matchMedia('(max-width:760px)');
    mobileBallots.addEventListener('change', placeReader);
    function placeReader() {
      if (!active) return;
      var reader = document.getElementById('reader');
      var button = panel.querySelector('.ballot-card[aria-pressed=true]');
      var workspace = panel.querySelector('.ballot-workspace');
      (mobileBallots.matches && button ? button.parentElement : workspace).appendChild(reader);
      panel.querySelectorAll('.ballot-card').forEach(function (card) {
        if (mobileBallots.matches) card.setAttribute('aria-expanded', card.getAttribute('aria-pressed'));
        else card.removeAttribute('aria-expanded');
      });
    }
    var retryButton = text(panel, 'button', 'Retry', 'retry'); retryButton.id = 'retryBallots'; retryButton.hidden = true; retryButton.onclick = loadBallots;
    function validateBallots(d) {
      dataCheck(isObject(d) && d.ok === true && d.student === data.name && Array.isArray(d.ballots));
      var ids = new Set();
      d.ballots.forEach(function (b) {
        dataCheck(isObject(b));
        texts(b,['id','sourceKind','event','date','round','format','judge','resolution','studentSide','strengths','improve','rfd','focus','focusResponse','provenance']);
        dataCheck(b.id.length > 0 && !ids.has(b.id)); ids.add(b.id);
        dataCheck(['practice','tournament'].includes(b.sourceKind) && ['IPDA','TIPDA','Unknown'].includes(b.format) && ['Aff','Neg','Unknown'].includes(b.studentSide));
        dataCheck(b.date === '' || /^\d{4}-\d{2}-\d{2}$/.test(b.date));
        dataCheck(b.studentResult === null || ['W','L'].includes(b.studentResult));
        dataCheck(b.studentPoints === null || typeof b.studentPoints === 'string' || (typeof b.studentPoints === 'number' && Number.isFinite(b.studentPoints)));
        missed(b.affNames); missed(b.negNames);
        dataCheck(Array.isArray(b.scores)); b.scores.forEach(function (s) { dataCheck(isObject(s)); texts(s,['label','value']); });
      });
    }
    var generation = 0, active = true, busy = false, aborter;
    retryButton.onclick = refresh;
    function stop() {
      active = false; generation++; if (aborter) aborter.abort();
      mobileBallots.removeEventListener('change', placeReader);
      ballots = []; selected = ''; panel.replaceChildren();
      app.classList.remove('student-view'); render(data);
    }
    function refresh() {
      if (!active) return;
      var wantsBallots = !document.getElementById('ballotsPanel').hidden || loaded;
      var g = ++generation; if (aborter) aborter.abort();
      busy = true; ballots = []; draw(); retryButton.hidden = true;
      document.getElementById('ballotStatus').textContent = 'Checking access and refreshing…';
      request(url).then(function (d) {
        if (!active || g !== generation) return;
        if (isObject(d) && typeof d.error === 'string') { stop(); showError('Error', d.error); return; }
        validate(d); data = d;
        if (!isObject(d.features) || d.features.newStudentView !== true) { stop(); return; }
        // Reuse the unchanged qualification renderer without replacing the live controls.
        var shell = Array.from(app.childNodes);
        render(d); var progressHTML = app.innerHTML;
        app.replaceChildren.apply(app, shell);
        document.getElementById('progressPanel').innerHTML = progressHTML;
        busy = false;
        if (wantsBallots || loaded) loadBallots();
      }).catch(function () { if (active && g === generation) { busy = false; failure(); } });
    }
    function request(endpoint) {
      var controller = new AbortController(); aborter = controller;
      var timer;
      // Race the deadline explicitly: even a transport that ignores abort cannot publish late data.
      return Promise.race([
        fetch(endpoint, {signal:controller.signal,cache:'no-store',referrerPolicy:'no-referrer'}).then(function (r) { if (!r.ok) throw new Error('HTTP failure'); return r.json(); }),
        new Promise(function (_, reject) { timer = setTimeout(function () { controller.abort(); reject(new Error('Timeout')); }, 20000); })
      ]).finally(function () { clearTimeout(timer); });
    }
    function failure() {
      ballots = []; draw();
      document.getElementById('ballotStatus').textContent = 'We could not load your ballots. Your progress records have not changed.';
      retryButton.hidden = false;
    }
    function loadBallots() {
      if (!active || busy) return;
      var g = ++generation; if (aborter) aborter.abort();
      ballots = []; draw(); retryButton.hidden = true;
      document.getElementById('ballotStatus').textContent = 'Loading your ballots…';
      request(url + '&view=student-ballots').then(function (d) {
        if (!active || g !== generation) return;
        if (isObject(d) && d.ok === false && d.code === 'DENIED' && typeof d.message === 'string') { stop(); return; }
        validateBallots(d);
        ballots = d.ballots;
        var events = document.getElementById('eventFilter'), previous = events.value;
        events.innerHTML = '<option value="">All sources</option>';
        Array.from(new Set(ballots.map(function (b) { return b.event; }))).sort().forEach(function (event) { var option = document.createElement('option'); option.value = event; var sample = ballots.find(function (b) { return b.event === event; }); option.textContent = eventLabel(event, sample.date, sample.sourceKind); events.appendChild(option); });
        events.value = previous; if (events.selectedIndex < 0) events.value = '';
        draw();
      }).catch(function () { if (active && g === generation) failure(); });
    }
    function text(parent, tag, value, className) {
      var node = document.createElement(tag); node.textContent = value;
      if (className) node.className = className;
      parent.appendChild(node); return node;
    }
    // Presentation aliases only: preserve source event names and filter values.
    function eventLabel(event, date, sourceKind) {
      if (sourceKind !== 'tournament') return event || 'Event not supplied';
      var short = /MTSU|Pejaver/i.test(event) ? 'MTSU' : /Southern Mississippi|Hub City Swing/i.test(event) ? 'USM' : /Razorback Rumble|UARK/i.test(event) ? 'UARK' : '';
      var year = (event.match(/\b(?:19|20)\d{2}\b/) || String(date || '').match(/^(?:19|20)\d{2}/) || [''])[0];
      return short ? short + (year ? ' ' + year : '') : event || 'Event not supplied';
    }
    function points(b) { return b.studentPoints === null || b.studentPoints === '' ? 'Not supplied' : String(b.studentPoints); }
    function draw() {
      var query = document.getElementById('searchBallots').value.trim().toLowerCase();
      var event = document.getElementById('eventFilter').value;
      var found = ballots.filter(function (b) { return (!event || b.event === event) && [b.event,eventLabel(b.event,b.date,b.sourceKind),b.judge,b.resolution,b.round,b.format].concat(b.affNames,b.negNames).join(' ').toLowerCase().includes(query); });
      document.getElementById('ballotStatus').textContent = !ballots.length ? 'No ballots yet.' : !found.length ? 'No matching ballots. Try another filter or search.' : found.length + ' judge ballots · Each panel judge is separate · Not a qualification-credit count';
      var list = document.getElementById('ballotList'), reader = document.getElementById('reader');
      panel.querySelector('.ballot-workspace').appendChild(reader);
      list.replaceChildren(); reader.replaceChildren(); reader.hidden = !found.length;
      if (!found.length) return;
      if (!found.some(function (b) { return b.id === selected; })) selected = found[0].id;
      found.forEach(function (b) {
        var item = text(list, 'div', '', 'ballot-item');
        var button = text(item, 'button', '', 'ballot-card'); button.type = 'button'; button.setAttribute('aria-pressed', b.id === selected);
        text(button, 'span', (b.sourceKind === 'practice' ? 'Practice' : 'Tournament') + ' · ' + b.format, 'chip');
        text(button, 'strong', eventLabel(b.event,b.date,b.sourceKind));
        text(button, 'span', [b.date,b.round,b.judge].filter(Boolean).join(' · '));
        text(button, 'span', 'Your result: ' + (b.studentResult || 'Not supplied') + ' · Your points: ' + points(b));
        button.onclick = function () {
          selected = b.id; draw();
          if (mobileBallots.matches) {
            var header = list.querySelector('.ballot-card[aria-pressed=true]');
            header.focus({preventScroll:true}); header.scrollIntoView({block:'start'});
          } else reader.focus({preventScroll:true});
        };
      });
      var b = found.find(function (b) { return b.id === selected; });
      text(reader, 'span', b.sourceKind + ' / ' + b.format, 'eyebrow');
      text(reader, 'h2', eventLabel(b.event,b.date,b.sourceKind));
      text(reader, 'p', [b.date,b.round,'Judge: ' + (b.judge || 'Not supplied')].filter(Boolean).join(' · '));
      text(reader, 'p', 'Your side: ' + b.studentSide);
      text(reader, 'p', 'Aff: ' + (b.affNames.join(' & ') || 'Not supplied'));
      text(reader, 'p', 'Neg: ' + (b.negNames.join(' & ') || 'Not supplied'));
      text(reader, 'h3', 'Resolution'); text(reader, 'p', b.resolution || 'Not supplied');
      var result = text(reader, 'div', '', 'own-result');
      text(result, 'p', 'Your result: ' + (b.studentResult || 'Not supplied'), b.studentResult === 'W' ? 'win' : b.studentResult === 'L' ? 'loss' : '');
      text(result, 'p', 'Your points: ' + points(b));
      b.scores.forEach(function (s) { text(reader, 'p', s.label + ': ' + (s.value || 'Not supplied')); });
      [['Strengths',b.strengths],['To improve',b.improve],['Reason for decision',b.rfd],['Your focus',b.focus],['Focus feedback',b.focusResponse]].forEach(function (pair) { text(reader,'h3',pair[0]); text(reader,'p',pair[1] || 'Not supplied','feedback'); });
      text(reader, 'small', b.provenance);
      placeReader();
    }
  }

  function showError(title, msg) {
    app.innerHTML = '<div class="error-msg"><h2>' + esc(title) + '</h2>' +
      '<p>' + esc(msg) + '</p></div>';
  }

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // Validate the complete response before constructing any HTML.
  function dataCheck(ok) {
    if (!ok) throw new Error('Invalid progress data');
  }
  function isObject(v) { return v !== null && typeof v === 'object' && !Array.isArray(v); }
  function validStatus(s) {
    return ['Behind', 'Due soon', 'On track', 'Complete', 'No data'].indexOf(s) >= 0;
  }
  function numbers(d, fields, signedFields) {
    fields.forEach(function (k) {
      dataCheck(typeof d[k] === 'number' && Number.isInteger(d[k]) && (d[k] >= 0 || (signedFields || []).indexOf(k) >= 0));
    });
  }
  function texts(d, fields) {
    fields.forEach(function (k) { dataCheck(typeof d[k] === 'string'); });
  }
  function milestones(items) {
    dataCheck(Array.isArray(items));
    items.forEach(function (m) {
      dataCheck(isObject(m));
      numbers(m, ['practiceEarned', 'serviceEarned', 'practiceTarget', 'serviceTarget'], ['practiceEarned', 'serviceEarned']);
      texts(m, ['deadline', 'notes']);
      dataCheck(typeof m.met === 'boolean' && typeof m.passed === 'boolean');
      dataCheck(m.exempt === undefined || typeof m.exempt === 'boolean');
    });
  }
  function missed(items) {
    dataCheck(Array.isArray(items) && items.every(function (s) { return typeof s === 'string'; }));
  }
  function validate(d) {
    dataCheck(isObject(d) && validStatus(d.status));
    numbers(d, ['practice', 'service', 'nextPracticeTarget', 'nextServiceTarget', 'practiceNeeded', 'serviceNeeded'], ['practice', 'service']);
    texts(d, ['name', 'asOf', 'seasonName', 'nextDeadline']);
    dataCheck(d.lastActivity === null || typeof d.lastActivity === 'string');
    missed(d.missed);
    if (d.warnings !== undefined) missed(d.warnings);
    milestones(d.milestones);
  }

  function render(d) {
    validate(d);
    var statusClass = 'status-' + d.status.replace(/\s+/g, '-');
    var practiceNeeded = d.practiceNeeded || 0;
    var serviceNeeded = d.serviceNeeded || 0;

    var html = '';

    // Header
    html += '<div class="header">';
    html += '<h1>' + esc(d.name) + '</h1>';
    html += '<div class="subtitle">Qualification Progress</div>';
    if (d.seasonName) html += '<div class="season">' + esc(d.seasonName) + ' Season</div>';
    html += '</div>';

    // Status badge
    html += '<div class="status-card">';
    html += '<span class="status-badge ' + statusClass + '">' + esc(d.status) + '</span>';
    html += '<div class="as-of">as of ' + esc(d.asOf) + '</div>';
    html += '</div>';

    // Credit counters
    if (d.warnings && d.warnings.length) html += '<div class="review-warning" style="padding:1rem;background:#fff4e5;color:#764c00"><b>Totals are provisional — coach review needed.</b><br>' + d.warnings.map(esc).join('<br>') + '</div>';
    html += '<div class="credits">';
    html += '<div class="credit-box">';
    html += '<div class="label">Practice Rounds</div>';
    html += '<div class="count">' + d.practice + '</div>';
    html += '<div class="target">of ' + d.nextPracticeTarget + ' needed</div>';
    html += '</div>';
    html += '<div class="credit-box">';
    html += '<div class="label">Service Credits</div>';
    html += '<div class="count">' + d.service + '</div>';
    html += '<div class="target">of ' + d.nextServiceTarget + ' needed</div>';
    html += '</div>';
    html += '</div>';

    // What's needed next
    html += '<div class="needs">';
    html += '<h3>Needed by ' + esc(d.nextDeadline) + '</h3>';
    html += '<div class="need-item"><span>Practice rounds</span>';
    html += '<span class="amount' + (practiceNeeded === 0 ? ' done' : '') + '">' +
      (practiceNeeded === 0 ? '✓ Met' : practiceNeeded + ' more') + '</span></div>';
    html += '<div class="need-item"><span>Service credits</span>';
    html += '<span class="amount' + (serviceNeeded === 0 ? ' done' : '') + '">' +
      (serviceNeeded === 0 ? '✓ Met' : serviceNeeded + ' more') + '</span></div>';
    html += '</div>';

    // Missed deadlines (if any)
    if (d.missed && d.missed.length) {
      html += '<div class="missed">';
      html += '<h3>Missed Deadlines</h3><ul>';
      d.missed.forEach(function (m) {
        html += '<li>' + esc(m) + '</li>';
      });
      html += '</ul></div>';
    }

    // Milestones timeline
    html += '<div class="milestones">';
    html += '<h3>Season Milestones</h3>';
    d.milestones.forEach(function (m) {
      var iconClass = m.exempt ? 'future' : (m.passed ? (m.met ? 'met' : 'missed') : 'future');
      var iconChar = m.exempt ? '—' : (m.passed ? (m.met ? '✓' : '✗') : '○');
      html += '<div class="milestone">';
      html += '<div class="icon ' + iconClass + '">' + iconChar + '</div>';
      html += '<div class="info">';
      html += '<div class="deadline">' + esc(m.deadline) + '</div>';
      html += '<div class="progress-nums">' + m.practiceEarned + '/' +
        m.practiceTarget + ' practice · ' + m.serviceEarned + '/' +
        m.serviceTarget + ' service</div>';
      if (m.notes) html += '<div class="detail">' + esc(m.notes) + '</div>';
      if (m.exempt) html += '<div class="detail">Not required — joined after this deadline.</div>';
      html += '</div></div>';
    });
    html += '</div>';

    // Last activity
    if (d.lastActivity) {
      html += '<div class="last-activity">Last recorded activity: ' +
        esc(d.lastActivity) + '</div>';
    }

    app.innerHTML = html;
  }
})();
</script>
</body>
</html>
